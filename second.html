<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-birthday page-hidden">

  <div class="bg-glow glow-2"></div>
  <canvas id="confetti-canvas"></canvas>

  <main class="birthday-container">

    <div class="birthday-inner">

      <div class="heart-row" aria-hidden="true">
        <span class="heart h1">♥</span>
        <span class="heart h2">♥</span>
        <span class="heart h3">♥</span>
      </div>

      <h1 class="birthday-heading">
        Happy Birthday
      </h1>

      <div class="name-line">ABC XYZ</div>

      <p class="birthday-sub">
        Every moment with you is a gift.<br />
        Today the universe celebrates you — and so do I.
      </p>

      <div class="divider-ornament">— ♥ —</div>

      <p class="birthday-note">
        May this year bring you joy beyond measure,<br />
        adventures worth remembering,<br />
        and love that never dims. 🕯️
      </p>

      <button class="replay-btn" onclick="window.location.href='index.html'">
        ↩ Read again
      </button>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
